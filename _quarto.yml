project:
  type: website
  output-dir: _site
  resources:
    - CNAME
  render:
    - index.qmd
    - posts.qmd
    - projects.qmd
    - seminar-series.qmd
    - resources.qmd
    - about.qmd
    - contact.qmd
    - posts/**/*.qmd

website:
  title: "UWC ML Liaison Notes"
  description: "A public working notebook on machine-learning weather prediction, verification, physical processes, and collaboration across UWC."
  site-url: https://uwc-ml.denby.eu
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: posts.qmd
        text: Blog
      - href: projects.qmd
        text: Projects
      - href: seminar-series.qmd
        text: 2PF Seminar Series
      - href: resources.qmd
        text: Resources
      - href: about.qmd
        text: About
      - href: contact.qmd
        text: Contact
  page-footer:
    left: "UWC ML Liaison Notes"
    right: "Built with Quarto | [Fork/edit on GitHub](https://github.com/leifdenby/uwc-ml-liaison-blog)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    link-external-newwindow: true
    date-format: long

execute:
  freeze: auto
